# Local development stack for PathwiseAI.
#
#   npm run db:up                    -> MongoDB only (run the app with `npm run dev`)
#   docker compose --profile app up  -> MongoDB + the production app container
#
# Connect MongoDB Compass with the MONGODB_URI from .env (or `npm run db:compass`).

name: pathwiseai

services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-pathwise}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-pathwise_dev_password}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-pathwise}
    ports:
      # Bound to localhost only: this is a dev database
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
      - ./docker/mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  app:
    profiles: ["app"]
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside the compose network Mongo is reachable by service name
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-pathwise}:${MONGO_ROOT_PASSWORD:-pathwise_dev_password}@mongo:27017/${MONGO_DB_NAME:-pathwise}?authSource=admin
      NEXTAUTH_URL: http://localhost:${APP_PORT:-3000}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
